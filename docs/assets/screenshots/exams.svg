    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display'" font-size="36" font-weight="500" fill="#0F172A">126 <tspan font-size="18" font-weight="500" fill="#94A3B8">/ 180 CFU</tspan></text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="11" fill="#64748B">70% completato della Laurea</text>
  </g>

  <!-- Card 3: Degree Base Score -->
  <g transform="translate(760, 0)" filter="url(#softShadow)">
    <rect width="360" height="110" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.6">BASE DI LAUREA PREVISTA</text>
    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display'" font-size="36" font-weight="500" fill="#8B5CF6">105.6 <tspan font-size="18" font-weight="500" fill="#94A3B8">/ 110</tspan></text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="11" fill="#8B5CF6">Con lode potenziale</text>
  </g>
</g>

