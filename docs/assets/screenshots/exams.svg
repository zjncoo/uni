      <!-- Main Content Insertion -->
      <g transform="translate(0, 36)">
        
<text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="12" font-weight="500" fill="#8B5CF6" letter-spacing="1">ESAMI &amp; PIANO DI STUDI</text>
<text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display'" font-size="30" font-weight="500" fill="#0F172A">Carriera Universitaria &amp; Appelli</text>

<!-- Metrics Row (GPA, CFU, Projection) -->
