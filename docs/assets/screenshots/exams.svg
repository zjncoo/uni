      <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display'" font-size="20" font-weight="500" fill="#0F172A">uni</text>
      
      <!-- Spotlight shortcut badge -->
      <rect x="195" y="6" width="38" height="20" rx="0" fill="#E2E8F0" />
      <text x="214" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="11" font-weight="450" fill="#64748B" text-anchor="middle">⌘K</text>
    </g>

