        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="14" fill="#334155">⚙️</text>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="13" font-weight="400" fill="#334155">Impostazioni</text>
