      <!-- Section: DIDATTICA -->
      <text x="12" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.8">DIDATTICA</text>

