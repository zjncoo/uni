        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="14" fill="#FFFFFF">⏱️</text>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text'" font-size="13" font-weight="600" fill="#FFFFFF">Scadenze &amp; Task</text>
